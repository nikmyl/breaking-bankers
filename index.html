<style id="gate-css">
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0a1510; color: #eef5ef;
    font: 16px/1.5 "Inter", system-ui, sans-serif;
    background-image: radial-gradient(900px 600px at 30% 0%, rgba(46,125,50,.4), transparent 60%); }
  .gate { width: min(440px, calc(100vw - 32px)); text-align: center; }
  .logo { display: grid; gap: 8px; justify-items: start; margin: 0 auto 28px; width: max-content; }
  .ln { display: flex; align-items: center; gap: 2px; font: 800 58px/1 "Inter"; letter-spacing: -.03em; }
  .ln.two { padding-left: 46px; }
  .t { width: 74px; height: 74px; border-radius: 5px; background: linear-gradient(#3b8f3f, #185c24); border: 2px solid rgba(210,240,200,.6);
    display: grid; place-items: center; font-size: 36px; color: #fff; position: relative; }
  .t small { position: absolute; top: 4px; left: 6px; font-size: 11px; font-weight: 700; }
  form { display: grid; gap: 12px; }
  input { font: 600 18px "JetBrains Mono", monospace; padding: 14px 16px; border-radius: 12px; border: 1px solid rgba(200,230,200,.25);
    background: #101c16; color: #eef5ef; text-align: center; }
  input:focus { outline: 2px solid #f2c230; }
  button { font: 800 17px "Inter"; padding: 14px; border: 0; border-radius: 12px; background: #f2c230; color: #111; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .msg { min-height: 24px; color: #a9bfb0; font-size: 14px; }
  .msg.err { color: #ff8a80; }
  @media (max-width: 420px) { .ln { font-size: 44px; } .t { width: 58px; height: 58px; font-size: 28px; } }

const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function unlock(pw) {
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(SALT), iterations: ITER, hash: "SHA-256" },
    km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const data = b64(PAYLOAD);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: data.slice(0, 12) }, key, data.slice(12));
  const site = JSON.parse(new TextDecoder().decode(plain));
  document.getElementById("gate-css").remove();
  const st = document.createElement("style"); st.textContent = site.css; document.head.appendChild(st);
  document.title = "The Breaking Bankers";
  document.body.innerHTML = site.html;
  new Function("DATA", "ASSETS", "KEY", site.js)(site.data, site.assets, key);
}
window.addEventListener("DOMContentLoaded", () => {
  const f = document.getElementById("f"), i = document.getElementById("pw"), m = document.getElementById("msg"), b = f.querySelector("button");
  f.addEventListener("submit", async (e) => {
    e.preventDefault(); b.disabled = true; m.className = "msg"; m.textContent = "Checking the formula…";
    try { await unlock(i.value.trim()); }
    catch (err) { b.disabled = false; m.className = "msg err"; m.textContent = "Wrong formula. Try again."; i.select(); }

  i.focus();
});
